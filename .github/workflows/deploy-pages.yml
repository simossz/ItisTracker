name: Deploy static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install schedule tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify private roster secret
        env:
          STUDENT_ROSTER_GZIP_BASE64: ${{ secrets.STUDENT_ROSTER_GZIP_BASE64 }}
        run: test -n "$STUDENT_ROSTER_GZIP_BASE64"

      - name: Build private student index
        env:
          STUDENT_ROSTER_GZIP_BASE64: ${{ secrets.STUDENT_ROSTER_GZIP_BASE64 }}
        run: |
          python -c "import base64,gzip,os; open('private-data/student-roster.csv','wb').write(gzip.decompress(base64.b64decode(os.environ['STUDENT_ROSTER_GZIP_BASE64'])))"
          python scripts/build_student_index.py
          python -c "from pathlib import Path; Path('private-data/student-roster.csv').unlink(missing_ok=True)"

      - name: Refresh staff schedules
        env:
          ITIS_USER: ${{ secrets.ITIS_USER }}
          ITIS_PASSWORD: ${{ secrets.ITIS_PASSWORD }}
        if: ${{ env.ITIS_USER != '' && env.ITIS_PASSWORD != '' }}
        run: |
          python -c "import getpass, runpy, sys; m=runpy.run_path('scripts/download_staff_timetables.py', run_name='not_main'); sys.exit(0 if m['download_teacher_schedules'](sys.argv[1], sys.argv[2], m['OUTPUT_DIR'], m['MANIFEST_PATH']) else 1)" "$ITIS_USER" "$ITIS_PASSWORD"

      - name: Build individual student and teacher pages
        run: python scripts/build_person_pages.py

      - name: Build static class timetable pages for search engines
        run: python scripts/build_class_pages.py

      - name: Build compact web data
        run: python scripts/build_web_data.py

      - name: Prepare minimal Pages artifact
        run: python scripts/prepare_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
